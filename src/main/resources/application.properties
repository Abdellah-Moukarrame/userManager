# DataSource H2
db.url=jdbc:h2:mem:usersdb
db.driver=org.h2.Driver
db.username=sa
db.password=

# Hikari
db.pool.maxSize=10
db.pool.minIdle=2

# Hibernate / JPA
hibernate.hbm2ddl.auto=update
hibernate.show_sql=true
hibernate.format_sql=true

# Application
app.password.minLength=8
app.user.selfUpdate.enabled=true
app.user.passwordChange.enabled=true